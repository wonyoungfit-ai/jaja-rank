name: Mirror charrank.php

on:
  schedule:
    - cron: '*/30 * * * *'   # 30분마다
  workflow_dispatch:          # "Run workflow" 버튼으로 수동 실행도 가능

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright (headless browser)
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Fetch charrank.php via headless browser
        run: |
          cat > _fetch_charrank.py <<'PYEOF'
          from playwright.sync_api import sync_playwright

          URL = "https://sa000001.com/sa2/info/charrank.php"
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36")

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(user_agent=UA, locale="ko-KR")
              page.goto(URL, wait_until="networkidle", timeout=30000)
              html = page.content()
              browser.close()

          with open("charrank.html", "w", encoding="utf-8") as f:
              f.write(html)
          PYEOF
          python3 _fetch_charrank.py
          rm -f _fetch_charrank.py

      - name: Sanity-check content
        run: |
          if ! grep -q "전투력" charrank.html; then
            echo "::error::charrank.html looks wrong (no '전투력' found) — site may have changed or blocked us"
            exit 1
          fi

      - name: Record fetch time
        run: date -u "+%Y-%m-%d %H:%M UTC" > charrank_time.txt

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charrank.html charrank_time.txt
          git diff --cached --quiet || git commit -m "Update charrank mirror"
          git push
