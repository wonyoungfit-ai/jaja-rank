yaml
name: Fetch Pet Rank

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-rank
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download rank page
        run: |
          curl -sf -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
               "https://sa000001.com/sa2/info/petrank.php" -o petrank.html
          echo "다운로드 완료, 크기:"
          wc -c petrank.html

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          date -u +'%Y-%m-%d %H:%M UTC' > petrank_time.txt
          git add petrank.html petrank_time.txt
          if git diff --staged --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "랭킹 갱신 $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git push && exit 0
            git fetch origin main && git rebase origin/main || exit 1
            sleep $((i * 3))
          done
          exit 1
