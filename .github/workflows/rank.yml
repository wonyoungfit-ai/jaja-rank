name: Fetch Pet Rank

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright (headless browser)
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: DEBUG fetch rank page
        run: |
          cat > _debug_fetch.py <<'PYEOF'
          from playwright.sync_api import sync_playwright

          URL = "https://sa000001.com/sa2/info/petrank.php"
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36")

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(user_agent=UA, locale="ko-KR")
              resp = page.goto(URL, wait_until="networkidle", timeout=30000)
              print("STATUS:", resp.status if resp else None)
              print("TITLE:", page.title())
              page.screenshot(path="debug_screenshot.png", full_page=True)
              html = page.content()
              browser.close()

          print("LEN:", len(html))
          print("----- SNIPPET START -----")
          print(html[:1500])
          print("----- SNIPPET END -----")

          with open("debug_petrank.html", "w", encoding="utf-8") as f:
              f.write(html)
          PYEOF
          python3 _debug_fetch.py

      - name: Upload debug artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debug-output
          path: |
            debug_screenshot.png
            debug_petrank.html
